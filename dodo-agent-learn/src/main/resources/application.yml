spring:
  # 声明持久化会话记忆使用的 JDBC 数据源配置。
  datasource:
    # 默认连接本机 dodo 数据库，但允许部署环境通过变量替换地址。
    url: ${DODO_DB_URL:jdbc:mysql://127.0.0.1:3306/dodo?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=GMT%2B8}
    # 默认使用本机学习环境的 root 用户，但允许部署环境通过变量替换用户名。
    username: ${DODO_DB_USERNAME:root}
    # 强制从环境变量读取密码，避免将任何数据库密码提交到仓库。
    password: ${DODO_DB_PASSWORD}
    # 指定 MySQL Connector/J 的 JDBC 驱动类型。
    driver-class-name: com.mysql.cj.jdbc.Driver
  application:
    name: dodo-agent-learn
  ai:
    openai:
      api-key: ${dashcode_key:} # 只从环境变量读取密钥，避免把真实凭证提交到学习仓库。
      base-url: https://llm-vgk8ko4szwiojh06.cn-beijing.maas.aliyuncs.com/compatible-mode
      chat:
        options:
          model: qwen3.7-max-2026-05-17
server:
  port: ${SERVER_PORT:8080}
