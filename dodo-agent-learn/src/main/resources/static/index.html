<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- 浏览器标题明确当前学习内容已经进入手写 ReAct 阶段。 -->
    <title>Dodo Agent Learn · Stage 2</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<main class="console">
    <header>
        <!-- 阶段标签帮助学习者区分阶段一的纯文本流。 -->
        <p class="eyebrow">DODO AGENT LEARN · STAGE 2</p>
        <!-- 主标题聚焦本阶段真正由代码控制的 Agent 循环。 -->
        <h1>手写 ReAct Agent</h1>
        <!-- 简介说明页面可观察的信息边界。 -->
        <p class="intro">观察模型选择工具、代码执行工具、Observation 回填以及最终回答的完整过程。</p>
    </header>

    <section class="session-card" aria-label="当前会话">
        <span>conversationId</span>
        <code id="conversation-id"></code>
    </section>

    <!-- 记忆面板只查看已经成功保存的跨请求问答，不混入本轮尚未结束的工具轨迹。 -->
    <section id="memory-panel" class="memory-panel" aria-label="会话记忆">
        <!-- 标题栏同时展示固定五轮窗口中的当前已加载轮次数。 -->
        <div class="memory-header">
            <!-- 标题明确这里展示的是跨 HTTP 请求保留的会话数据。 -->
            <h2>会话记忆 <span id="memory-turn-count">尚未加载</span></h2>
            <!-- 操作按钮只影响记忆接口，不能启动或停止当前 Agent。 -->
            <div class="memory-actions">
                <!-- 刷新按钮重新读取当前 conversationId 的已完成历史。 -->
                <button id="refresh-memory" class="secondary" type="button">刷新记忆</button>
                <!-- 清空按钮显式删除当前 conversationId 已保存的历史窗口。 -->
                <button id="clear-memory" class="secondary danger" type="button">清空记忆</button>
            <!-- 结束记忆操作按钮容器。 -->
            </div>
        <!-- 结束记忆标题与操作栏。 -->
        </div>
        <!-- 初始状态避免把“尚未请求”误表达为“没有历史”。 -->
        <p id="memory-status" class="memory-status" data-state="ready">尚未加载记忆</p>
        <!-- 脚本将以 textContent 创建历史条目，禁止服务端历史作为 HTML 注入。 -->
        <div id="memory-turns" class="memory-turns" aria-live="polite"></div>
    <!-- 结束跨请求会话记忆面板。 -->
    </section>

    <!-- 运行轨迹只展示已成功持久化的安全元数据，不混入模型上下文。 -->
    <section id="run-trace-panel" class="run-trace-panel" aria-label="运行轨迹">
        <div class="memory-header">
            <h2>运行轨迹 <span id="run-trace-count">尚未加载</span></h2>
            <div class="memory-actions">
                <button id="refresh-run-traces" class="secondary" type="button">刷新轨迹</button>
            </div>
        </div>
        <p id="run-trace-status" class="memory-status" data-state="ready">尚未加载运行轨迹</p>
        <div id="run-traces" class="run-traces" aria-live="polite"></div>
    </section>

    <section class="input-panel">
        <label for="message">发送给模型的消息</label>
        <textarea id="message" rows="5" placeholder="例如：用一句话解释什么是 Agent" autofocus></textarea>
        <div class="actions">
            <button id="send" type="button">开始流式请求</button>
            <button id="stop" class="secondary" type="button" disabled>停止</button>
        </div>
    </section>

    <!-- 工具轨迹只展示 Action 参数和 Observation 结果，不展示模型内部推理文本。 -->
    <section class="tool-panel" aria-label="工具调用轨迹">
        <!-- 标题帮助学习者把工具生命周期与最终回答区分开。 -->
        <h2>工具调用轨迹</h2>
        <!-- 前端按照 toolCallId 在此创建或更新同一张工具卡片。 -->
        <div id="tool-trace" aria-live="polite">
            <!-- 初始占位说明尚未收到 tool_start 事件。 -->
            <p class="tool-empty">本轮尚未调用工具</p>
        <!-- 结束工具轨迹容器。 -->
        </div>
    <!-- 结束阶段二工具生命周期展示区域。 -->
    </section>

    <section class="output-panel">
        <div class="output-header">
            <h2>Agent 输出</h2>
            <span id="status" data-state="ready">就绪</span>
        </div>
        <pre id="output" aria-live="polite">等待请求……</pre>
    </section>

    <footer>
        <!-- 页脚列出本阶段稳定事件协议并强调最终回答与工具轨迹分区。 -->
        本阶段展示 tool_start、tool_end、text、error、complete 五种事件。
    </footer>
</main>
<script src="js/app.js"></script>
</body>
</html>
