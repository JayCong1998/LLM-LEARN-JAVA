server:
  port: 8001
  servlet:
    encoding:
      charset: UTF-8
      force: true


spring:
  application:
    name: KnowEngine
  servlet:
    multipart:
      enabled: true
      max-file-size: 100MB
      max-request-size: 100MB
  datasource:
    # 默认连接本机学习数据库。
    url: jdbc:mysql://127.0.0.1:3306/know_engine_learn?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=GMT%2B8
    # 默认使用本机 root 用户。
    username: root
    # 本机默认 root 密码。
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

langchain4j:
  open-ai:
    chat-model:
      # 百炼 API Key。
      api-key: ${dashcode_key:}
      # 百炼 OpenAI 兼容接口。
      base-url: https://llm-vgk8ko4szwiojh06.cn-beijing.maas.aliyuncs.com/compatible-mode/v1
      # 百炼模型名称。
      model-name: qwen3.6-plus
    streaming-chat-model:
      # 流式模型使用与非流式模型一致的服务配置。
      api-key: ${dashcode_key:}
      base-url: https://llm-vgk8ko4szwiojh06.cn-beijing.maas.aliyuncs.com/compatible-mode/v1
      model-name: qwen3.6-plus


elasticsearch:
  host: http://127.0.0.1:9200
  base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
  model-name: text-embedding-v4
  api-key: ${dashcode_key:}
  dimensions: 1536

minio:
  url: http://localhost:9000 # 记得改成你自己的
  accessKey: minioadmin # 记得改成你自己的
  secretKey: minioadmin # 记得改成你自己的
  bucketName: know-engine # 记得改成你自己的
  endpoint: http://localhost:9000 # 记得改成你自己的

neo4j:
  uri: bolt://localhost:7687
  username: neo4j
  password: neo4j666


