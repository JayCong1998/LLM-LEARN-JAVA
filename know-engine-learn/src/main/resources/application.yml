spring:
  datasource:
    # 默认连接本机学习数据库；部署环境可通过 DB_URL 替换地址。
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/know_engine_learn?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=GMT%2B8}
    # 默认使用本机 root 用户；部署环境可通过 DB_USERNAME 替换用户名。
    username: ${DB_USERNAME:root}
    # 本机默认 root；部署环境请设置 DB_PASSWORD 覆盖该值。
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

langchain4j:
  open-ai:
    chat-model:
      # 仅从环境变量读取密钥，避免把真实凭证提交到学习仓库。
      api-key: ${dashcode_key:}
      base-url: https://llm-vgk8ko4szwiojh06.cn-beijing.maas.aliyuncs.com/compatible-mode
      model-name: qwen-plus
    streaming-chat-model:
      # 流式模型使用相同的 OpenAI 兼容服务与密钥。
      api-key: ${dashcode_key:}
      base-url: https://llm-vgk8ko4szwiojh06.cn-beijing.maas.aliyuncs.com/compatible-mode
      model-name: qwen-plus
